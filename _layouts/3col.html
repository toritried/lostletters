<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Letters</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" id="switcher-id" href="">
    <link rel="icon" href="/graphics/favicon/ribbon.ico" type="image/x-icon" />
    <link href="/styles/style-my-tooltips.css" rel="stylesheet" type="text/css"/>
    <link rel="me" href="https://social.lol/@lostletters"/>
    <link rel="me" href="https://github.com/toritried"/>
    <link rel="webmention" href="https://webmention.io/lostletters.neocities.org/webmention"/>
    <link rel="pingback" href="https://webmention.io/lostletters.neocities.org/xmlrpc"/>
    <link rel="proof" href="proven.lol/7e28e0"/>
    <link rel="alternate" type="application/atom+xml" title="Lost Letters Feed" href="{{ site.url }}/feed.xml">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.type != null %}{{ page.type }}{% elsif page.layout == "post" %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{% if page.image != null %}{{ page.image }}{% else %}/graphics/layout/site-preview.png{% endif %}">
</head>
<body id="top">
    <div class="overlay"></div>
    <div class="main">
        <header class="header">
            <div class="title">
                <a href="/">
                    Welcome to Lost Letters
                </a>
            </div>
            {% include layout/mobile-nav.html %}
        </header>
        <main class="main-content">
            <article>
                {{ content }}
            </article>
            <br>
            <div id="webmentions"></div>
        </main>
        {% include layout/footer.html %}
    </div>
</body>
</html>
